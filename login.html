<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- CSS -->
<link rel="stylesheet" href="/css/main.css">

<title>Login Page</title>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
   

  <!-- LOGO -->
  <a class="navbar-brand d-flex align-items-center gap-2">
    <h5 class="m-0">Bookshop</h5>
    <img src="/img/Vector.png" width="20">
  </a>

  <!-- TOGGLE -->
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- LINKS -->
  <div class="collapse navbar-collapse" id="nav">

    <!-- LEFT -->
    <ul class="navbar-nav me-auto gap-3">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Books</a></li>
      <li class="nav-item"><a class="nav-link" href="#">About us</a></li>
    </ul>

    <!-- RIGHT -->
    <div> 
      <a class="btn btn-pink text-white">Login</a>
     <a class="btn btn-white-pink">Sign up</a>
      
    </div>

  </div>
</nav>

<!-- LOGIN FORM -->

<div class="container d-flex justify-content-center align-items-center" style="height:80vh;">

  <form id="loginForm" class="w-100" style="max-width:350px;">

    <h3 class="text-center mb-4 text-pink">Welcome Back</h3>

    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" id="emailInput" class="form-control" placeholder="example@gmail.com" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required>
    </div>

    <div class="d-flex justify-content-between mb-3 small">
      <div>
        <input type="checkbox"> Remember me
      </div>
      <a href="forgot.html" class="text-pink">Forget password?</a>
    </div>

    <button type="submit" id="loginBtn" class="btn btn-pink w-100 mb-3">Login</button>

    <p class="text-center">
      Don't have account? <a href="signup.html" class="text-pink">Sign up</a>
    </p>

    <hr>

    <button type="button" class="btn btn-light w-100 mb-2">
      <i class="fa-brands fa-google"></i> Login with Google
    </button>

    <button type="button" class="btn btn-primary w-100">
      <i class="fa-brands fa-facebook"></i> Login with Facebook
    </button>

  </form>

</div>
  

<footer class="footer py-4">

  <div class="container">

    <!-- TOP SECTION -->
    <div class="d-flex justify-content-between align-items-start flex-wrap">

      <!-- LEFT -->
      <div class="d-flex flex-column gap-2">

        <div class="d-flex align-items-center gap-2 mb-2">
          <img src="/img/Vector.png" width="25">
          <strong class="text-white">Book Shop</strong>
        </div>

        <a href="#">Home</a>
        <a href="#">Books</a>
        <a href="#">About Us</a>

      </div>

      <!-- RIGHT ICONS -->
      <div class="footer-icons d-flex align-items-start gap-2">
        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-youtube"></i>
        <i class="fa-brands fa-x-twitter"></i>
      </div>

    </div>
<div class="dropdown">
  <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
    🌍 English
  </button>

  <ul class="dropdown-menu">
    <li><a class="dropdown-item" href="#">English</a></li>
    <li><a class="dropdown-item" href="#">Arabic</a></li>
  </ul>
</div>
    <!-- LINE -->
    <div class="footer-line my-3"></div>

    <!-- BOTTOM TEXT -->
    <div class="d-flex justify-content-end">
      <p class="footer-text m-0">
        Developed By EraaSoft All Copy Rights Reserved ©2024
      </p>
    </div>

  </div>

</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/login.js"></script>
  <script src="/js/api,s.js"></script>
  <script src="/js/register api.js"></script>
</body>
</html>
